name: Publier une mise à jour automatique

on:
  push:
    branches: [main]
    paths-ignore:
      - "telechargement/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orderboard-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Incrémenter la version
        id: version
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Retry safely if another commit reaches main after checkout.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            npm version patch --no-git-tag-version
            VERSION="$(node -p "require('./package.json').version")"
            git add package.json package-lock.json
            git commit -m "[skip ci] chore: release v$VERSION"

            if git push origin HEAD:main; then
              echo "value=$VERSION" >> "$GITHUB_OUTPUT"
              echo "Version $VERSION publiée sur main."
              exit 0
            fi

            echo "Push refusé (tentative $attempt/3). Nouvelle synchronisation avec origin/main."
          done

          echo "::error::Impossible de publier le numéro de version après 3 tentatives."
          exit 1

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Compiler l'interface
        run: npm run build

      - name: Créer et pousser le tag de version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          git tag -a "v$VERSION" -m "OrderBoard v$VERSION"
          git push origin "v$VERSION"

      - name: Construire l'installeur sans publication automatique
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Tester le serveur embarqué
        shell: bash
        run: |
          # Lance le serveur exactement comme l'application installée (binaire Electron en mode Node).
          cd dist/win-unpacked/resources/server
          test -d node_modules/next || { echo "::error::node_modules/next absent du serveur embarqué."; exit 1; }
          ELECTRON_RUN_AS_NODE=1 ORDERBOARD_DATA_DIR="$RUNNER_TEMP/smoke" PORT=34999 HOSTNAME=127.0.0.1 NODE_ENV=production \
            ../../OrderBoard.exe server.js > "$RUNNER_TEMP/smoke.log" 2>&1 &
          PID=$!
          ready=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:34999/api/health || true)
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 1
          done
          fail=0
          if [ "$ready" != "1" ]; then fail=1; echo "::error::Le serveur embarqué ne démarre pas."; fi
          if [ "$fail" = "0" ]; then
            for route in /overview /orders/new /workboards /clients /settings /api/workboards /api/inbox/discord; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:34999$route" || true)
              echo "$route -> $code"
              if [ "$code" != "200" ]; then fail=1; echo "::error::$route répond $code."; fi
            done
          fi
          kill $PID 2>/dev/null || true
          taskkill //F //IM OrderBoard.exe //T > /dev/null 2>&1 || true
          if [ "$fail" != "0" ]; then echo "--- journal ---"; cat "$RUNNER_TEMP/smoke.log"; exit 1; fi

      - name: Vérifier les fichiers générés
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          test -f "dist/OrderBoard-Setup-$VERSION.exe" || {
            echo "::error::L'installeur .exe est absent du dossier dist."
            ls -lah dist || true
            exit 1
          }
          test -f "dist/latest.yml" || {
            echo "::error::Le fichier latest.yml nécessaire à electron-updater est absent."
            ls -lah dist || true
            exit 1
          }

      - name: Publier la release et tous ses fichiers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          gh release create "v$VERSION" \
            "dist/OrderBoard-Setup-$VERSION.exe" \
            "dist/latest.yml" \
            dist/*.blockmap \
            --title "OrderBoard $VERSION" \
            --generate-notes
