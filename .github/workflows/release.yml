name: Publier une mise à jour automatique

on:
  push:
    branches: [main]
    paths-ignore:
      - "telechargement/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orderboard-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Incrémenter la version
        id: version
        shell: bash
        run: |
          npm version patch --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "[skip ci] chore: release v$VERSION"
          git push origin HEAD:main

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Compiler l'interface
        run: npm run build

      - name: Créer et pousser le tag de version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          git tag -a "v$VERSION" -m "OrderBoard v$VERSION"
          git push origin "v$VERSION"

      - name: Construire l'installeur sans publication automatique
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Vérifier les fichiers générés
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          test -f "dist/OrderBoard-Setup-$VERSION.exe" || {
            echo "::error::L'installeur .exe est absent du dossier dist."
            ls -lah dist || true
            exit 1
          }
          test -f "dist/latest.yml" || {
            echo "::error::Le fichier latest.yml nécessaire à electron-updater est absent."
            ls -lah dist || true
            exit 1
          }

      - name: Publier la release et tous ses fichiers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          gh release create "v$VERSION" \
            "dist/OrderBoard-Setup-$VERSION.exe" \
            "dist/latest.yml" \
            dist/*.blockmap \
            --title "OrderBoard $VERSION" \
            --generate-notes
