name: Publier une mise à jour automatique

on:
  push:
    branches: [main]
    paths-ignore:
      - "telechargement/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orderboard-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Chaque changement publié sur main reçoit automatiquement une nouvelle version.
      # Le commit de version porte [skip ci] pour éviter une boucle de workflow.
      - name: Incrémenter la version
        id: version
        shell: bash
        run: |
          npm version patch --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "[skip ci] chore: release v$VERSION"
          git push origin HEAD:main

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Compiler l'interface
        run: npm run build

      - name: Créer le tag de version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          SHA="$(git rev-parse HEAD)"
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/v$VERSION" \
            -f sha="$SHA"

      - name: Construire et publier l'installeur Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish always
