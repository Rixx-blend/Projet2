name: Déployer la synchro des planches

on:
  push:
    branches: [main]
    paths: ["sync-worker/**", ".github/workflows/deploy-sync.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-sync
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sync-worker
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sync-worker/package-lock.json

      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps

      - name: Construire la page des planches
        run: npm run build:web

      - name: Vérifier et normaliser le secret Cloudflare
        env:
          CLOUDFLARE_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN_RAW:-}" ]; then
            echo "::error::Le secret CLOUDFLARE_API_TOKEN est absent ou vide dans GitHub."
            exit 1
          fi

          # Supprime uniquement les espaces parasites en début/fin et les retours CR/LF.
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN_RAW" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$TOKEN" ]; then
            echo "::error::Le secret Cloudflare est vide après nettoyage."
            exit 1
          fi

          if printf '%s' "$TOKEN" | grep -q '[[:space:]]'; then
            echo "::error::Le secret Cloudflare contient encore des espaces internes. Remplace le secret par le token brut, sans guillemets ni retour à la ligne."
            exit 1
          fi

          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "Secret Cloudflare présent et format vérifié (valeur masquée)."

      - name: Déployer sur Cloudflare
        run: npx wrangler deploy
