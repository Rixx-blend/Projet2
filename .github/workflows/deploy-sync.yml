name: Déployer la synchro des planches

on:
  push:
    branches: [main]
    paths: ["sync-worker/**", ".github/workflows/deploy-sync.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-sync
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sync-worker
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sync-worker/package-lock.json

      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps

      - name: Vérifier le serveur cloud
        run: npm run typecheck

      - name: Construire la page des planches
        run: npm run build:web
        env:
          VITE_TLDRAW_LICENSE_KEY: ${{ secrets.TLDRAW_LICENSE_KEY }}

      - name: Normaliser et valider le secret Cloudflare
        env:
          CLOUDFLARE_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN_RAW:-}" ]; then
            echo "::error::Le secret CLOUDFLARE_API_TOKEN est absent ou vide dans GitHub."
            exit 1
          fi

          # Ne garde que le jeton lui-même (cfut_ suivi de caractères alphanumériques),
          # même si le secret contient du texte ou des espaces autour.
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN_RAW" | grep -oE 'cfut_[A-Za-z0-9_]{20,}' | head -n 1 || true)"

          if [ -z "$TOKEN" ]; then
            echo "::error::Aucun jeton Cloudflare (cfut_...) trouvé dans le secret. Recolle uniquement le jeton, sans texte autour."
            exit 1
          fi

          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "Secret Cloudflare normalisé (valeur masquée)."

      - name: Déployer sur Cloudflare
        run: npx wrangler deploy
